<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:14px system-ui;background:#eee}
.row{display:flex;gap:16px;padding:16px;align-items:center;flex-wrap:wrap}
.dark{background:#3e3e3f}.white{background:#fff}.black{background:#1e1e20}
img{display:block}.l{width:460px}.i{width:96px;border-radius:20px}.s{width:32px}
p{margin:0 16px;padding-top:8px;color:#555}
</style></head><body>
<p>logo-dark.svg / logo-on-dark.svg (na #3e3e3f i #1e1e20)</p>
<div class="row dark"><img class="l" src="logo-dark.svg"><img class="l" src="logo-on-dark.svg"></div>
<div class="row black"><img class="l" src="logo-on-dark.svg"></div>
<p>logo-light.svg i logo-mono.svg na belom</p>
<div class="row white"><img class="l" src="logo-light.svg"><img class="l" src="logo-mono.svg"></div>
<p>icon.svg i icon-j.svg: 96px, 48px, 32px</p>
<div class="row white"><img class="i" src="icon.svg"><img style="width:48px;border-radius:10px" src="icon.svg"><img class="s" src="icon.svg"><span style="width:40px"></span><img class="i" src="icon-j.svg"><img style="width:48px;border-radius:10px" src="icon-j.svg"><img class="s" src="icon-j.svg"></div>
</body></html>
