name: Noćni bekap baze

# pg_dump produkcione baze svake noći; fajl se čuva kao privatni artifact repozitorijuma 30 dana.
# Potrebna tajna: Settings → Secrets and variables → Actions → SUPABASE_DB_URL (ista adresa kao DATABASE_URL na Vercelu).
# Vraćanje: pg_restore --clean --no-owner -d <adresa baze> baza.dump
on:
  schedule:
    - cron: "30 1 * * *" # 02:30 zimi / 03:30 leti po beogradskom vremenu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: pg_dump (klijent Postgres 17 iz zvaničnog Docker image-a)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Tajna SUPABASE_DB_URL nije podešena."; exit 1; fi
          mkdir -p backup
          docker run --rm -e DATABASE_URL -v "$PWD/backup:/backup" postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --schema=public --schema=drizzle --file=/backup/baza.dump'
          ls -lh backup
      # akcije su zaključane na commit SHA (verzija u komentaru)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bekap-baze-${{ github.run_id }}
          path: backup/baza.dump
          retention-days: 30
          if-no-files-found: error
